# UGREEN LED server configuration (see ARCHITECTURE.md, section 5).
#
# The server refuses to start on any syntax or semantic error, including
# duplicate rules for the same network.

[server]
# Endpoints. Remote listeners require explicit configuration.
unix_socket=/tmp/ugreen-leds-server.sock
tcp_bind=127.0.0.1
tcp_port=39001

# Scheduler coalescing interval in milliseconds.
scheduler_interval_ms=20

# Global connection cap (0 = unlimited).
max_connections=64

# Per-connection command rate limit in commands/second (0 = unlimited).
command_rate_limit=500

# Server-wide hardware read rate limit in reads/second (0 = unlimited).
hardware_read_rate_limit=10

# Process lock file preventing two server instances.
lock_file=/tmp/ugreen-leds-server.lock

# Logging. By default info-level messages go to the console (stdout), where
# the service manager (journal) captures them. Set log_file to write to a
# file instead, and verbose=true to enable debug-level logging for
# troubleshooting.
#log_file=/var/log/ugreen-leds-server.log
#verbose=false

# ---------------------------------------------------------------------------
# Access rules. A connection is matched against every rule; the most specific
# source prefix wins and is the complete policy (no merging). No matching
# rule means the connection is denied.
#
#   source           local (Unix socket) or IPv4/IPv6 CIDR
#   leds             all, or a comma-separated list of LED names
#   verbs            any of CAPS,GET,SET,RESET,FLUSH (default: all)
#   priority         priority ceiling; clients may only request values
#                    greater than or equal to this (closer to 0 is higher)
#   max_connections  per-rule connection cap (0 = unlimited)
# ---------------------------------------------------------------------------

[access.local-admin]
source=local
leds=all
verbs=CAPS,GET,SET,RESET,FLUSH
priority=0
max_connections=8

[access.admin]
source=192.168.178.30/32
leds=all
verbs=CAPS,GET,SET,RESET,FLUSH
priority=0
max_connections=2

[access.storage-agent]
source=192.168.178.120/32
leds=disk1,disk2,disk3,disk4
verbs=CAPS,GET,SET,RESET,FLUSH
priority=10
max_connections=2

[access.lan-status]
source=192.168.178.0/24
leds=all
verbs=CAPS,GET
priority=100
max_connections=2

# ---------------------------------------------------------------------------
# Per-LED fallback state applied on RESET or when the owning connection
# disconnects, so activity indicators never stay lit in an orphaned state.
# ---------------------------------------------------------------------------

[fallback]
power=mode=on brightness=100
netdev=mode=off
disk1=mode=off
disk2=mode=off
disk3=mode=off
disk4=mode=off
